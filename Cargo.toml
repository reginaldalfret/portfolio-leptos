[package]
name = "portfolio-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", default-features = false, features = ["csr"] }
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Element", "Location"] }
